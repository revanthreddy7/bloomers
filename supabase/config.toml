project_id = "bloomers-v1"
[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback"]
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 900

[analytics]
enabled = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Verify your Bloomers parent account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Bloomers password"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
email_sent = 20
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30
